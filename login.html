<!-- 07_login_with_csrf_comment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login Form (CSRF token)</title>
</head>
<body>
  <h1>Login</h1>
  <form action="#" method="post">
    <label>Username:<br><input type="text" name="username" required></label><br><br>
    <label>Password:<br><input type="password" name="password" required></label><br><br>
    <input type="hidden" name="csrf_token" value="dummy_csrf_token_12345">
    <!-- The CSRF token prevents cross-site request forgery by ensuring the request originated from this site. -->
    <button type="submit">Login</button>
  </form>
</body>
</html>
