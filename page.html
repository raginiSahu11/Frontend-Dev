<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-Class Demo</title>
    <link rel="stylesheet" href="Q1.css">
</head>

<body>
<header><h1>Pseudo-Class Demonstration</h1></header>

<main class="container">
    <section class="box">
        <a href="#">Hover Me</a>
        <p>:hover — changes style when mouse is over it</p>
    </section>

    <section class="box">
        <input type="text" placeholder="Click to focus">
        <p>:focus — applied when input is active</p>
    </section>

    <section class="box">
        <button>Click & Hold</button>
        <p>:active — works during mouse press</p>
    </section>

    <ul class="box list">
        <li>Item 1</li>
        <li>Item 2 (nth-child)</li>
        <li>Item 3</li>
        <p>:nth-child — styles selected list item</p>
    </ul>
</main>

</body>
</html>
