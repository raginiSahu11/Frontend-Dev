<!-- transforms.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="transforms.css">
</head>
<body>
  <header><h1>Transformations: rotate, scale, translate, skew</h1></header>
  <main>
    <section class="row">
      <figure class="demo rotate">
        <div class="toy">Rotate</div>
        <figcaption>rotate()</figcaption>
      </figure>
      <figure class="demo scale">
        <div class="toy">Scale</div>
        <figcaption>scale()</figcaption>
      </figure>
      <figure class="demo translate">
        <div class="toy">Translate</div>
        <figcaption>translate()</figcaption>
      </figure>
      <figure class="demo skew">
        <div class="toy">Skew</div>
        <figcaption>skew()</figcaption>
      </figure>
    </section>
  </main>
  <footer><p>Hover each card to see the transformation</p></footer>
</body>
</html>
