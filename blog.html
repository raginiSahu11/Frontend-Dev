<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Home</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
:root{
    --bs-primary:#6a00ff; /* custom theme */
    --bs-font-sans-serif:'Poppins',sans-serif;
}
.card:hover{ transform: translateY(-6px); transition:.4s;}
</style>
</head>

<body>

<header class="bg-primary text-white p-4 text-center">
    <h1 class="fw-bold">Tech Insights Blog</h1>
</header>

<section class="container mt-4">

    <div class="row g-4">

        <div class="col-md-6">
            <div class="card p-3">
                <h3>Latest in AI</h3>
                <p>AI is rapidly changing industries worldwide.</p>
                <button class="btn btn-primary">Read More</button>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <h3>Web Development Trends</h3>
                <p>From React to Web3 — what's next?</p>
                <button class="btn btn-primary">Read More</button>
            </div>
        </div>

    </div>
</section>

<footer class="bg-dark text-white text-center p-3 mt-4">
    © 2025 Tech Blog
</footer>

</body>
</html>
