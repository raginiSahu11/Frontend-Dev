<!-- 19_form_security_autocomplete_off.html -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Form</title></head>
<body>
  <h1>Secure Input Form</h1>
  <form action="#" method="post" autocomplete="off">
    <label>Username:<br><input type="text" name="username" required></label><br><br>
    <label>Password:<br><input type="password" name="password" required></label><br><br>
    <button type="submit">Submit</button>
  </form>
  <p>Note: Turning off autocomplete reduces the chance that sensitive values will be stored or auto-filled by the browser on shared devices.</p>
</body>
</html>
