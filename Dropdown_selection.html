<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dropdown Selection</title>
  <style>body{font-family:Arial;margin:18px}select{display:block;margin:8px 0;padding:6px}</style>
</head>
<body>
  <h1>Location & Favourite Place Selection</h1>

  <label for="country">Country</label>
  <select id="country" name="country">
    <option value="india" selected>India</option>
    <option value="usa">USA</option>
    <option value="uk">United Kingdom</option>
  </select>

  <label for="state">State</label>
  <select id="state" name="state">
    <option value="maharashtra" selected>Maharashtra</option>
    <option value="karnataka">Karnataka</option>
    <option value="tamil">Tamil Nadu</option>
  </select>

  <label for="city">City</label>
  <select id="city" name="city">
    <option value="mumbai" selected>Mumbai</option>
    <option value="pune">Pune</option>
    <option value="bangalore">Bangalore</option>
  </select>

  <label for="place">Favorite Tourist Place</label>
  <select id="place" name="place">
    <option value="gateway" selected>Gateway of India</option>
    <option value="ere">Eiffel Tower</option>
    <option value="colosseum">Colosseum</option>
  </select>

  <p>Selected: Country - India; State - Maharashtra; City - Mumbai; Place - Gateway of India.</p>
</body>
</html>
