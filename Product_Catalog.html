<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Product Catalog</title>
  <style>body{font-family:Arial;margin:18px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #ccc;text-align:left}img{max-width:120px;height:auto;display:block}</style>
</head>
<body>
  <h1>Product Catalog</h1>
  <table>
    <caption>Available Products</caption>
    <thead>
      <tr>
        <th>Product</th>
        <th>Description</th>
        <th>Image</th>
        <th>Price</th>
        <th>Availability</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Classic Mug</td>
        <td>A ceramic mug, 350ml capacity.</td>
        <td><img src="https://via.placeholder.com/120x80.png?text=Mug" alt="Classic ceramic mug"></td>
        <td>$9.99</td>
        <td>In Stock</td>
      </tr>
      <tr>
        <td>Wireless Mouse</td>
        <td>Ergonomic wireless mouse with USB receiver.</td>
        <td><img src="https://via.placeholder.com/120x80.png?text=Mouse" alt="Wireless mouse"></td>
        <td>$19.99</td>
        <td>Out of Stock</td>
      </tr>
      <tr>
        <td colspan="2">Bundle: Mug + Mouse</td>
        <td><img src="https://via.placeholder.com/120x80.png?text=Bundle" alt="Bundle image"></td>
        <td colspan="2">$25.00 (Limited)</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
