<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<header class="container text-center mt-4">
    <h1 class="fw-bold">Ragini Sen</h1>
    <p class="text-muted">Frontend Developer | UI Designer</p>
</header>

<main class="container text-center">

    <!-- Profile Image -->
    <img src="profile.jpg" class="img-fluid rounded-circle my-4" width="180">

    <button class="btn btn-primary me-2">Hire Me</button>
    <button class="btn btn-dark">Download CV</button>

    <!-- Contact Form -->
    <form class="mt-4 w-50 mx-auto">
        <input type="text" placeholder="Name" class="form-control mb-3">
        <input type="email" placeholder="Email" class="form-control mb-3">
        <textarea rows="3" class="form-control mb-3" placeholder="Message"></textarea>
        <button class="btn btn-success w-100">Send</button>
    </form>

</main>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2025 Ragini Portfolio
</footer>

</body>
</html>
