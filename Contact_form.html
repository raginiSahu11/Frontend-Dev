<!-- 10_contact_form_placeholder_required.html -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact</title></head>
<body>
  <h1>Contact Us</h1>
  <form action="#" method="post">
    <label>Full Name:<br><input type="text" name="name" placeholder="Your full name" required></label><br><br>
    <label>Email:<br><input type="email" name="email" placeholder="you@example.com" required></label><br><br>
    <label>Subject:<br><input type="text" name="subject" placeholder="Subject" required></label><br><br>
    <label>Message:<br><textarea name="message" rows="6" placeholder="Write your message here..." required></textarea></label><br><br>
    <button type="submit">Send</button>
  </form>
</body>
</html>
