<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment</title></head>
<body>
  <h1>Payment</h1>
  <form action="#" method="post">
    <label>Cardholder Name:<br><input type="text" name="cardname" required></label><br><br>
    <label>Card Number:<br><input type="text" name="cardnum" inputmode="numeric" required></label><br><br>
    <label>Expiry Date:<br><input type="month" name="expiry" required></label><br><br>
    <label>CVV:<br><input type="password" name="cvv" maxlength="4" required></label><br><br>
    <button type="submit">Pay Now</button>
  </form>
</body>
</html>
