<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Card Flip</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,Arial;background:#eef2f8}
    .scene{width:320px;height:420px;perspective:1000px}
    .card{
      width:100%;height:100%;
      position:relative;
      transform-style:preserve-3d;
      transition: transform .8s cubic-bezier(.2,.8,.2,1);
    }
    .card:hover{transform: rotateY(180deg)}
    .side{
      position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;overflow:hidden;
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;
      box-shadow:0 14px 32px rgba(20,30,60,0.12);
      background:#fff;
    }
    .front img{width:100%;height:220px;object-fit:cover;border-radius:8px}
    .front h3{margin:14px 0 8px}
    .back{
      transform: rotateY(180deg);
      background:linear-gradient(180deg,#2b7aeb,#1e5cc8);
      color:#fff;
    }
    .back p{max-width:90%}

    /* center page */
    .wrap{display:flex;align-items:center;justify-content:center;height:100vh}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="scene" aria-label="3D flipping card">
      <div class="card" role="button" tabindex="0">
        <div class="side front">
          <img src="https://picsum.photos/seed/front/800/400" alt="Product image">
          <h3>Awesome Widget</h3>
          <p style="color:#555">A sleek widget for everyday tasks.</p>
        </div>

        <div class="side back">
          <h3>Details</h3>
          <p>Full description: This widget helps you organize tasks, track time, and customize workflows with ease.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
