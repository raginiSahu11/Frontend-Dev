<!-- 02_google_map_iframe.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embedded Google Map</title>
</head>
<body>
  <!-- loading="lazy" defers loading of the iframe until it's near viewport to improve performance -->
  <iframe
    title="Map of Example City"
    src="https://www.google.com/maps?q=New+Delhi,+India&output=embed"
    width="100%" height="60%" loading="lazy" style="border:0"></iframe>
</body>
</html>
