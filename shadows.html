<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shadows & Depth</title>
  <link rel="stylesheet" href="shadows.css">
</head>
<body>
  <header><h1>Shadows & Depth</h1></header>
  <main>
    <section class="cards">
      <article class="card soft">
        <h3>Soft Card</h3>
        <p>A gentle, subtle shadow for low elevation.</p>
      </article>
      <article class="card medium">
        <h3>Medium Card</h3>
        <p>Pronounced shadow for mid-level elevation.</p>
      </article>
      <article class="card strong">
        <h3>Strong Card</h3>
        <p>Deep shadow for high elevation effect.</p>
      </article>
    </section>
  </main>
  <footer><p>Hover the cards to lift them up</p></footer>
</body>
</html>
