<!-- 17_form_and_result_iframe.html -->
<!-- Save this as form.html and create result.html as shown in the next block -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form with iframe</title></head>
<body>
  <h1>Submit Form</h1>
  <form target="result_iframe" action="result.html" method="get">
    <label>Text: <input type="text" name="text" required></label>
    <button type="submit">Submit</button>
  </form>
  <iframe name="result_iframe" title="Result" width="100%" height="200" style="border:1px solid #ccc"></iframe>
</body>
</html>
