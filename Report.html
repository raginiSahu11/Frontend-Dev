<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Report</title>
  <style>body{font-family:Arial;margin:18px}table{border-collapse:collapse;width:60%}th,td{border:1px solid #ccc;padding:8px}</style>
</head>
<body>
  <h1>Greenfield High School</h1>

  <h2>Student: John Smith</h2>

  <table title="Marks for 5 subjects">
    <thead>
      <tr><th>Subject</th><th>Marks</th></tr>
    </thead>
    <tbody>
      <tr><td>Mathematics</td><td>88</td></tr>
      <tr><td>English</td><td>76</td></tr>
      <tr><td>Science</td><td>82</td></tr>
      <tr><td>History</td><td>74</td></tr>
      <tr><td>Geography</td><td>80</td></tr>
      <tr>
        <td colspan="1">Total</td>
        <td>400</td>
      </tr>
      <tr>
        <td colspan="1">Percentage</td>
        <td>80%</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
