<!-- 04_frameset_navigation.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frameset Example</title>
</head>
<frameset rows="100,*">
  <frame srcdoc="<nav><a href='#'>Home</a> | <a href='#'>About</a> | <a href='#'>Contact</a></nav>" name="topnav">
  <frame srcdoc="<h1>Welcome to My Website</h1><p>Enjoy browsing.</p>" name="mainframe">
  <noframes>
    <body>
      <h1>Frames are not supported.</h1>
      <p>This page uses frames.</p>
    </body>
  </noframes>
</frameset>
</html>
