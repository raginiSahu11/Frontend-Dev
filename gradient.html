<!-- gradients.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gradient Backgrounds</title>
  <link rel="stylesheet" href="gradients.css">
</head>
<body>
  <header class="fixed-header">
    <h1>Gradient Background Webpage</h1>
  </header>

  <main>
    <section class="linear-section">
      <div class="inner">
        <h2>Linear Gradient</h2>
        <p>This section uses a linear-gradient background (left → right).</p>
      </div>
    </section>

    <section class="radial-section">
      <div class="inner">
        <h2>Radial Gradient (Parallax-like)</h2>
        <p>This section uses a radial-gradient with background-attachment: fixed.</p>
      </div>
    </section>
  </main>

  <footer class="fixed-footer">
    <p>Header & Footer are fixed. Assignment 7 — Gradients</p>
  </footer>
</body>
</html>
