<!-- 09_file_upload_jpg_png.html -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Image</title></head>
<body>
  <h1>Upload an Image</h1>
  <form action="#" method="post" enctype="multipart/form-data">
    <label>Select image (.jpg, .png only):<br>
      <input type="file" name="image" accept=".jpg,.jpeg,.png" required>
    </label>
    <p>Allowed: JPG and PNG images only (photographs, avatars).</p>
    <br>
    <button type="submit">Upload</button>
  </form>
</body>
</html>
