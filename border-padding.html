<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Borders & Padding Demo</title>
  <link rel="stylesheet" href="borders-padding.css">
</head>
<body>
  <header>
    <h1>Borders & Padding Demonstration</h1>
  </header>
  <main>
    <section class="container">
      <article class="box solid">Solid border<br><span class="info">padding: 12px</span></article>
      <article class="box dashed">Dashed border<br><span class="info">padding: 18px</span></article>
      <article class="box double">Double border<br><span class="info">padding: 24px</span></article>
      <article class="box groove">Groove border<br><span class="info">padding: 30px</span></article>
      <article class="box rounded">Rounded corners<br><span class="info">border-radius: 16px</span></article>
    </section>
  </main>
  <footer>
    <p>Assignment 7 — Borders & Padding</p>
  </footer>
</body>
</html>
