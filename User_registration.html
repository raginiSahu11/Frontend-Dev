<!-- 06_user_registration_required.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration</title>
</head>
<body>
  <h1>Register</h1>
  <form action="#" method="post">
    <label>Full Name:<br><input type="text" name="fullname" required></label><br><br>
    <label>Email Address:<br><input type="email" name="email" required></label><br><br>
    <label>Password:<br><input type="password" name="password" required></label><br><br>
    <label>Confirm Password:<br><input type="password" name="confirm" required></label><br><br>
    <button type="submit">Register</button>
  </form>
</body>
</html>
