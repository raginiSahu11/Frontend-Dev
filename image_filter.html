<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>
<header><h2>Responsive Image Filter Gallery</h2></header>

<main class="gallery">
    <figure><img src="img1.jpg" class="blur" alt=""><figcaption>Blur</figcaption></figure>
    <figure><img src="img2.jpg" class="gray" alt=""><figcaption>Grayscale</figcaption></figure>
    <figure><img src="img3.jpg" class="sepia" alt=""><figcaption>Sepia</figcaption></figure>
    <figure><img src="img4.jpg" class="bright" alt=""><figcaption>Brightness</figcaption></figure>
    <figure><img src="img5.jpg" class="contrast" alt=""><figcaption>Contrast</figcaption></figure>
    <figure><img src="img6.jpg" class="hue" alt=""><figcaption>Hue Rotate</figcaption></figure>
</main>

</body>
</html>
